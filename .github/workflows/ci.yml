# Lints, typechecks and tests every push to main and every pull request against it, then builds
# what a release builds short of the installers: the command's package and the desktop app as it
# is packaged. The release tags before the desktop app is built (release.yml), so a bundling
# break is found here, not on a tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # pnpm at the version package.json names, Node.js, the store's cache and `pnpm install`,
      # whose `prepare` patches TypeScript with the Effect language service for the typecheck.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Pack the command
        run: pnpm pack:local

      # `pnpm desktop:build` without electron-builder: the app's code, the adapters, the editor
      # and the server, bundled as the installers hold them. With `run`: `pnpm stage` alone is
      # a command of pnpm's own.
      - name: Stage the desktop app
        run: pnpm -F @ultrapaint/desktop run stage
