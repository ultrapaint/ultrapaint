# Run by hand, from the Actions tab on main: raises the version in the root package.json, commits
# and tags it, and attaches the command's package (`pnpm pack:local`) to a GitHub release, to be
# installed for any repository with `pnpm add -g ./ultrapaint-<version>.tgz`. The desktop app is
# then built from the tag on Linux and macOS (`pnpm desktop:build`), unsigned, and kept as the
# run's artifacts: not attached to the release, and no update feed, until the repository is
# public (PLAN-desktop D15).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version to release: raise a part of package.json's, or release it as it is"
        type: choice
        options: [patch, minor, major, as-is]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # pnpm at the version package.json names, Node.js, the store's cache and `pnpm install`.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # The same checks as CI, so a release never packs a commit that fails them.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Raise the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != "as-is" ]; then
            npm version "$BUMP" --no-git-tag-version
          fi
          version=$(node -p "require('./package.json').version")
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; raise the version instead"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: pnpm pack:local

      - name: Try the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Installed the way the release notes say, into a pnpm home of its own.
        run: |
          export PNPM_HOME="$RUNNER_TEMP/pnpm-global"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm add -g "./dist/ultrapaint-$VERSION.tgz"
          test "$(ultrapaint --version)" = "ultrapaint v$VERSION"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore: release v$VERSION"
          fi
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/ultrapaint-$VERSION.tgz" \
            --title "v$VERSION" \
            --generate-notes \
            --notes "Needs Node.js 24 or newer. To run it without installing, in the repository you want to design in:

          \`\`\`bash
          dir=\$(mktemp -d)
          gh release download v$VERSION --repo $GITHUB_REPOSITORY --pattern '*.tgz' --dir \"\$dir\"
          pnpm dlx \"\$dir\"/ultrapaint-$VERSION.tgz
          \`\`\`

          To install it, then run \`ultrapaint\` in any repository:

          \`\`\`bash
          gh release download v$VERSION --repo $GITHUB_REPOSITORY --pattern '*.tgz'
          pnpm add -g ./ultrapaint-$VERSION.tgz
          \`\`\`"

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # An AppImage and a deb on Linux, a dmg and a zip on macOS (Apple silicon).
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build the desktop app
        run: pnpm desktop:build

      - uses: actions/upload-artifact@v7
        with:
          name: ultrapaint-${{ needs.release.outputs.version }}-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
