# Run by hand, from the Actions tab on main: raises the version in the root package.json, commits
# and tags it, and makes a draft GitHub release with the command's package (`pnpm pack:local`),
# installed for any repository with `npm install -g <its URL>`. The desktop app is then built
# from the tag on Linux and macOS (`pnpm desktop:build`, unsigned, Apple silicon only on macOS)
# and its installers and update feeds attached to the draft (ADR 0051). Once both are there, the
# release is published: AppImages update to it, and the cask in ultrapaint/homebrew-tap follows it
# within the hour, by a workflow of the tap's own.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version to release: raise a part of package.json's, or release it as it is"
        type: choice
        options: [patch, minor, major, as-is]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags and the commits since the previous release, for its notes.
          fetch-depth: 0
      # pnpm at the version package.json names, Node.js, the store's cache and `pnpm install`.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # The same checks as CI, so a release never packs a commit that fails them.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Raise the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != "as-is" ]; then
            npm version "$BUMP" --no-git-tag-version
          fi
          version=$(node -p "require('./package.json').version")
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; raise the version instead"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: pnpm pack:local

      - name: Try the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Installed the way the release notes say, into a pnpm home of its own.
        run: |
          export PNPM_HOME="$RUNNER_TEMP/pnpm-global"
          export PATH="$PNPM_HOME/bin:$PATH"
          pnpm add -g "./dist/ultrapaint-$VERSION.tgz"
          test "$(ultrapaint --version)" = "ultrapaint v$VERSION"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore: release v$VERSION"
          fi
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # A draft until the desktop app is attached: nothing updates to a release without it.
        # The package twice: by its version, and as `ultrapaint.tgz`, which `releases/latest/download/`
        # always finds. The notes: what the release brings, from the commits since the previous
        # one, which the desktop app shows (ADR 0078); after the install mark, how to install it.
        run: |
          cp "dist/ultrapaint-$VERSION.tgz" dist/ultrapaint.tgz
          previous=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || true)
          node scripts/release-notes.ts "$previous" "v$VERSION" > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          **The command** needs Node.js 24 or newer. Install it, then run \`ultrapaint\` in any repository:

          \`\`\`bash
          npm install -g https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/ultrapaint-$VERSION.tgz
          \`\`\`

          **The desktop app**, unsigned for now. It updates itself from the next release on: a restart from the item at the foot of its rail.

          - macOS (Apple silicon): \`brew install --cask ultrapaint/tap/ultrapaint\`, or the \`.dmg\` below. Unsigned, it opens once you run \`xattr -dr com.apple.quarantine /Applications/Ultrapaint.app\`.
          - Linux: the AppImage, or the \`.deb\`, which is updated by hand.
          NOTES
          gh release create "v$VERSION" "dist/ultrapaint-$VERSION.tgz" dist/ultrapaint.tgz \
            --draft \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # An AppImage and a deb on Linux, a dmg and a zip on macOS (Apple silicon).
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build the desktop app
        run: pnpm desktop:build

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        # The installers, their block maps and the update feed (latest-linux.yml, latest-mac.yml).
        run: |
          shopt -s nullglob
          cd apps/desktop/release
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" *.AppImage *.deb *.dmg *.zip *.blockmap latest*.yml --clobber

  publish:
    needs: [release, desktop]
    runs-on: ubuntu-26.04
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
