<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <title>Decisions</title>
    <style>
    :root {
      --bg: #f4f4f2;
      --card: #fff;
      --ink: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --soft: #ececea;
      --accent: #2563eb;
      --accent-soft: #e8effd;
      --mark: #e11d48;
      --line-strong: #a1a1aa;
      --error: #dc2626;
      --shadow: rgb(0 0 0 / 0.06);
      font:
        15px / 1.5 ui-sans-serif,
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      color: var(--ink);
      color-scheme: light;
      background: var(--bg);
    }
    /* Dark follows the system unless the page is set to a theme (the bar's switch). */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121214;
        --card: #1c1c1f;
        --ink: #ececee;
        --muted: #9f9fa9;
        --line: #2f2f35;
        --soft: #17171a;
        --accent: #7aa5ff;
        --accent-soft: #1b2438;
        --mark: #f43f5e;
        --line-strong: #5b5b66;
        --error: #f87171;
        --shadow: rgb(0 0 0 / 0.4);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #121214;
      --card: #1c1c1f;
      --ink: #ececee;
      --muted: #9f9fa9;
      --line: #2f2f35;
      --soft: #17171a;
      --accent: #7aa5ff;
      --accent-soft: #1b2438;
      --mark: #f43f5e;
      --line-strong: #5b5b66;
      --error: #f87171;
      --shadow: rgb(0 0 0 / 0.4);
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    /* The card fills the window above the bar: its text on the left, its pictures on the right,
       each scrolling on its own. */
    body {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-columns: minmax(0, 1fr);
      height: 100dvh;
      margin: 0;
      background: var(--bg);
    }
    main {
      display: grid;
      grid-template-columns: minmax(360px, 36%) minmax(0, 1fr);
      min-height: 0;
    }
    main.solo {
      grid-template-columns: minmax(0, 1fr);
    }
    .text {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
      padding: 24px 28px 32px;
      overflow-y: auto;
    }
    main.solo .text {
      justify-self: center;
      width: min(760px, 100%);
    }
    .pictures {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
      gap: 16px;
      align-content: start;
      min-height: 0;
      padding: 24px 24px 32px 4px;
      overflow-y: auto;
    }
    .pictures:empty {
      display: none;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .ghost {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 7px 14px;
      white-space: nowrap;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .ghost:hover:not(:disabled) {
      border-color: var(--line-strong);
    }
    label.ghost {
      cursor: pointer;
    }
    .ghost:disabled {
      color: var(--line-strong);
      cursor: default;
    }
    .ghost[hidden] {
      display: none;
    }
    kbd {
      font: inherit;
      font-size: 12px;
      font-weight: 400;
      opacity: 0.6;
    }
    .kicker {
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      line-height: 1.3;
      text-wrap: balance;
    }
    .body p {
      margin: 0 0 10px;
    }
    .body p:last-child {
      margin-bottom: 0;
    }
    .body ul {
      padding-left: 20px;
      margin: 0 0 10px;
    }
    .body li {
      margin: 4px 0;
    }
    code {
      padding: 2px 5px;
      font:
        13px / 1 ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
      background: var(--soft);
      border-radius: 4px;
    }
    /* A picture in its panel: the caption on top, the picture centred below it. */
    .shot {
      display: grid;
      grid-template-rows: auto 1fr;
      margin: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .shot figcaption {
      padding: 9px 14px;
      font-size: 13px;
      line-height: 1.45;
      border-bottom: 1px solid var(--line);
    }
    .shot figcaption b {
      font-weight: 600;
      color: var(--accent);
    }
    .stage {
      display: grid;
      place-items: center;
      padding: 12px;
      background: var(--soft);
      border-radius: 0 0 10px 10px;
    }
    /* The frame wraps the picture exactly, so a mark's fractions are fractions of the picture. */
    .frame {
      position: relative;
      max-width: 100%;
      cursor: zoom-in;
    }
    .frame img {
      display: block;
      max-width: 100%;
      max-height: calc(100dvh - 190px);
      border-radius: 4px;
      box-shadow: 0 0 0 1px var(--line);
    }
    .mark {
      position: absolute;
      border: 2px solid var(--mark);
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgb(255 255 255 / 0.6);
    }
    .mark span {
      position: absolute;
      bottom: calc(100% + 4px);
      left: -2px;
      padding: 1px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      background: var(--mark);
      border-radius: 4px;
    }
    .mark.below span {
      top: calc(100% + 4px);
      bottom: auto;
    }
    .mark.right span {
      top: 50%;
      bottom: auto;
      left: calc(100% + 6px);
      transform: translateY(-50%);
    }
    .mark.inside span {
      top: 2px;
      bottom: auto;
      left: 2px;
    }
    /* The agent's own call, when it made one: what the person says is right or wrong. */
    .call {
      padding: 14px 16px;
      background: var(--accent-soft);
      border-radius: 10px;
    }
    .call p {
      margin: 0 0 6px;
    }
    .call p:last-child {
      margin: 0;
    }
    .options {
      display: grid;
      gap: 8px;
    }
    .option {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 12px 14px;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .option:hover {
      border-color: var(--line-strong);
    }
    .option[aria-pressed="true"] {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .key {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .option[aria-pressed="true"] .key {
      color: var(--card);
      background: var(--accent);
      border-color: var(--accent);
    }
    .label {
      font-weight: 600;
    }
    .then {
      font-size: 14px;
      color: var(--muted);
    }
    .tag {
      padding-top: 2px;
      font-size: 12px;
      color: var(--accent);
      white-space: nowrap;
    }
    textarea {
      width: 100%;
      min-height: 72px;
      padding: 10px 12px;
      font: inherit;
      color: inherit;
      resize: vertical;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    textarea.over {
      border-color: var(--accent);
    }
    .under {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .saved {
      min-height: 18px;
      font-size: 13px;
      color: var(--muted);
    }
    /* Images added to the answer: thumbnails under the comment, each with its remove. */
    .attached {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .attached:not(:empty) {
      margin-top: 8px;
    }
    .thumb {
      position: relative;
    }
    .attached .thumb img {
      display: block;
      width: 88px;
      height: 64px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .thumb button {
      position: absolute;
      top: -6px;
      right: -6px;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      padding: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 50%;
    }
    .thumb svg {
      width: 12px;
      height: 12px;
    }
    .summary {
      display: grid;
      gap: 2px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: baseline;
      padding: 10px 12px;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 8px;
    }
    .row:hover {
      background: var(--card);
    }
    .row .answer {
      color: var(--muted);
    }
    .row .answer.none {
      color: var(--error);
    }
    .row .said {
      grid-column: 1 / -1;
      font-size: 14px;
      color: var(--muted);
    }
    /* The bar: moving through the deck on the left, Right and Wrong in the middle when the card
       has a call, the progress and the page's switches on the right. */
    .bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--line);
    }
    .count {
      min-width: 64px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
    }
    .spacer {
      flex: 1 1 0;
    }
    .verdict {
      display: flex;
      gap: 8px;
    }
    .verdict[hidden] {
      display: none;
    }
    .verdict button {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      min-width: 140px;
      padding: 8px 18px;
      font-weight: 600;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .verdict button:hover {
      border-color: var(--line-strong);
    }
    .verdict button[aria-pressed="true"] {
      color: var(--card);
      background: var(--ink);
      border-color: var(--ink);
    }
    .progress {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
    }
    .meter {
      flex: 0 0 96px;
      height: 4px;
      overflow: hidden;
      background: var(--line);
      border-radius: 2px;
    }
    .meter i {
      display: block;
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s;
    }
    .ghost svg {
      width: 16px;
      height: 16px;
    }
    .ghost.icon {
      padding: 7px 9px;
    }
    .icon svg {
      width: 18px;
      height: 18px;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 20px;
      cursor: zoom-out;
      background: rgb(0 0 0 / 0.85);
    }
    .lightbox.open {
      display: grid;
    }
    .lightbox .frame {
      cursor: zoom-out;
    }
    .lightbox .frame img {
      max-height: calc(100dvh - 40px);
    }
    /* Narrower: one column that scrolls as a whole, the pictures under the text. */
    @media (max-width: 960px) {
      main,
      main.solo {
        display: block;
        overflow-y: auto;
      }
      .text,
      .pictures {
        overflow: visible;
      }
      .pictures {
        padding: 0 16px 24px;
      }
      .text {
        padding: 20px 16px 24px;
      }
      main.solo .text {
        margin: 0 auto;
      }
    }
    @media (max-width: 640px) {
      .bar {
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      }
      .verdict {
        flex: 1 1 100%;
        order: -1;
      }
      .verdict button {
        flex: 1 1 0;
        min-width: 0;
      }
      .word,
      #intro,
      kbd,
      .meter,
      .progress {
        display: none;
      }
      .spacer {
        display: none;
      }
      .count {
        flex: 1 1 auto;
      }
    }
    </style>
  </head>
  <body>
    <main id="main">
      <section class="text" id="text"></section>
      <section aria-label="Pictures" class="pictures" id="pictures"></section>
    </main>
    <footer class="bar">
      <button class="ghost" id="back" title="Previous (←)" type="button">
        <svg aria-hidden="true" fill="none" viewBox="0 0 16 16">
          <path
            d="M13 8H3m4-4L3 8l4 4"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
          />
        </svg><span class="word">Previous</span>
      </button>
      <span class="count" id="count"></span>
      <button class="ghost" id="next" title="Next (→)" type="button">
        <span class="word">Next</span
        ><svg aria-hidden="true" fill="none" viewBox="0 0 16 16">
          <path
            d="M3 8h10M9 4l4 4-4 4"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
          />
        </svg>
      </button>
      <span class="spacer"></span>
      <div class="verdict" hidden id="verdict">
        <button id="wrong" type="button">Wrong <kbd>W</kbd></button>
        <button id="right" type="button">Right <kbd>R</kbd></button>
      </div>
      <span class="spacer"></span>
      <span class="progress" id="progress"></span>
      <span class="meter"><i id="meter"></i></span>
      <button class="ghost" hidden id="intro" type="button">Intro</button>
      <button class="ghost" id="all" title="Every answer (A)" type="button">
        Answers <kbd>A</kbd>
      </button>
      <button
        class="ghost icon"
        id="theme"
        title="Light or dark (T)"
        type="button"
      >
        <svg aria-hidden="true" fill="none" viewBox="0 0 20 20">
          <circle
            cx="10"
            cy="10"
            r="7.25"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path d="M10 2.75a7.25 7.25 0 0 1 0 14.5z" fill="currentColor" />
        </svg>
      </button>
    </footer>
    <div class="lightbox" id="lightbox"></div>
    <script>
    "use strict";
    /** The key that sends a comment as the answer, with Enter: ⌘ on a Mac, Ctrl elsewhere. */
    const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘" : "Ctrl+";
    const $ = (id) => document.getElementById(id);
    let deck;
    let answers = {};
    // -1 is the intro, cards.length the summary.
    let at = 0;

    const CODE_RE = /`([^`]+)`/g;
    const BOLD_RE = /\*\*([^*]+)\*\*/g;
    const BLOCK_RE = /\n\s*\n/;
    const DIGIT_RE = /^[1-9]$/;
    const esc = (s) =>
      s
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    const inline = (s) =>
      esc(s)
        .replace(CODE_RE, "<code>$1</code>")
        .replace(BOLD_RE, "<strong>$1</strong>");
    /** Paragraphs, `- ` lists, **bold** and `code`: what a deck's text uses. */
    const markdown = (text) =>
      text
        .trim()
        .split(BLOCK_RE)
        .map((block) => {
          const lines = block.split("\n");
          if (lines.every((l) => l.trim().startsWith("- "))) {
            return `<ul>${lines.map((l) => `<li>${inline(l.trim().slice(2))}</li>`).join("")}</ul>`;
          }
          return `<p>${inline(lines.join(" "))}</p>`;
        })
        .join("");

    const pct = (n) => `${(n * 100).toFixed(2)}%`;
    /** A picture with its marks: boxes around what the card asks about, each with its label. */
    const frame = (p) =>
      `<div class="frame"><img loading="lazy" src="/data/${encodeURI(p.src)}" alt="${esc(p.caption)}" />${(
        p.marks ?? []
      )
        .map(
          (m) =>
            `<div class="mark ${m.at ?? (m.y < 0.08 ? "inside" : "above")}" style="left:${pct(m.x)};top:${pct(m.y)};width:${pct(m.width)};height:${pct(m.height)}">${
              m.label ? `<span>${esc(m.label)}</span>` : ""
            }</div>`
        )
        .join("")}</div>`;
    /** A caption whose first part names the picture (`Figma 05.1/03 · Paused`): that part stands out. */
    const caption = (text) => {
      const cut = text.indexOf(" · ");
      return cut > 0 && cut < 60
        ? `<b>${esc(text.slice(0, cut))}</b> · ${esc(text.slice(cut + 3))}`
        : esc(text);
    };
    /** A card the agent made the call on: the person says only whether it is right. */
    const hasCall = (card) =>
      card?.proposal !== undefined &&
      card.options.length === 2 &&
      card.options.some((o) => o.key === card.recommend);
    /** The option a verdict on the call stands for: Right its own, Wrong the other. */
    const optionFor = (card, right) =>
      card.options.find((o) => (o.key === card.recommend) === right).key;
    /** What an answer said of the card's call, for the summary. */
    const ofCall = (card, a) => {
      if (!(hasCall(card) && a?.choice)) {
        return "";
      }
      return a.choice === card.recommend ? " · call right" : " · call wrong";
    };
    const answered = () => deck.cards.filter((c) => answers[c.id]).length;
    const firstOpen = () => {
      const i = deck.cards.findIndex((c) => !answers[c.id]);
      return i < 0 ? deck.cards.length : i;
    };

    function bar() {
      const n = deck.cards.length;
      $("progress").textContent = `${answered()} of ${n} answered`;
      $("meter").style.width = `${(answered() / n) * 100}%`;
      const where = { [-1]: "Intro", [n]: "Answers" };
      $("count").textContent = where[at] ?? `${at + 1} / ${n}`;
      $("back").disabled = at <= (deck.intro ? -1 : 0);
      $("next").disabled = at >= n;
      $("intro").hidden = !deck.intro || at === -1;
    }

    /** Shows the card, the intro or the summary: text on the left, the card's pictures beside it. */
    function show(i) {
      at = Math.max(deck.intro ? -1 : 0, Math.min(i, deck.cards.length));
      bar();
      const card = deck.cards[at];
      const called = hasCall(card);
      $("verdict").hidden = !called;
      const el = $("text");
      const pictures = $("pictures");
      pictures.innerHTML = (card?.pictures ?? [])
        .map(
          (p) =>
            `<figure class="shot"><figcaption>${caption(p.caption)}</figcaption><div class="stage">${frame(p)}</div></figure>`
        )
        .join("");
      $("main").classList.toggle("solo", !card?.pictures?.length);
      for (const scroller of [$("main"), el, pictures]) {
        scroller.scrollTop = 0;
      }
      if (at === -1) {
        el.innerHTML = `<h2>${esc(deck.title)}</h2><div class="body">${markdown(deck.intro)}</div>
            <div><button type="button" class="ghost" id="start">Start <kbd>Enter</kbd></button></div>`;
        $("start").onclick = () => show(firstOpen());
        return;
      }
      if (at === deck.cards.length) {
        el.innerHTML = `<div><div class="kicker">${esc(deck.title)} · ${answered()} of ${deck.cards.length} answered · saved as you went</div>
            <h2>Your answers</h2></div><div class="summary">${deck.cards
              .map((c, j) => {
                const a = answers[c.id];
                return `<button type="button" class="row" data-j="${j}"><span>${esc(c.title)}</span>
                  <span class="answer ${a ? "" : "none"}">${a ? esc(a.label + ofCall(c, a) + (a.images?.length ? ` · ${a.images.length} image${a.images.length === 1 ? "" : "s"}` : "")) : "not answered"}</span>
                  ${a?.comment ? `<span class="said">“${esc(a.comment)}”</span>` : ""}</button>`;
              })
              .join("")}</div>`;
        for (const row of el.querySelectorAll(".row")) {
          row.onclick = () => show(Number(row.dataset.j));
        }
        return;
      }
      const given = answers[card.id];
      el.innerHTML = `
          <div><div class="kicker">${esc(deck.title)}${card.eyebrow ? ` · ${esc(card.eyebrow)}` : ""}</div><h2>${esc(card.title)}</h2></div>
          ${called ? `<div class="call">${markdown(card.proposal)}</div>` : ""}
          ${card.body ? `<div class="body">${markdown(card.body)}</div>` : ""}
          ${
            called
              ? ""
              : `<div class="options">${card.options
                  .map(
                    (
                      o,
                      k
                    ) => `<button type="button" class="option" data-key="${esc(o.key)}" aria-pressed="${given?.choice === o.key}">
                <span class="key">${k + 1}</span>
                <span><span class="label">${esc(o.label)}</span>${o.leads ? `<br /><span class="then">${esc(o.leads)}</span>` : ""}</span>
                ${card.recommend === o.key ? `<span class="tag">Recommended</span>` : ""}
              </button>`
                  )
                  .join("")}</div>`
          }
          <div><textarea id="comment" placeholder="${called ? "A comment with Right or Wrong, or your own answer. Paste or drop an image here" : "Your own answer, or a comment with the option you pick. Paste or drop an image here"}">${esc(given?.comment ?? "")}</textarea>
          <div class="attached" id="attached"></div>
          <div class="under"><span class="saved" id="saved">${savedLine(card, given)}</span>
          <span class="actions"><label class="ghost" for="pick">Add image</label>
          <input accept="image/png,image/jpeg,image/webp,image/gif" hidden id="pick" multiple type="file" />
          <button type="button" class="ghost" id="own">Send as my answer</button></span></div></div>`;
      images = [...(given?.images ?? [])];
      showImages();
      $("pick").onchange = (event) => {
        addImages([...event.target.files]);
        event.target.value = "";
      };
      const comment = $("comment");
      comment.addEventListener("paste", (event) => {
        const files = [...(event.clipboardData?.files ?? [])];
        if (files.length > 0) {
          event.preventDefault();
          addImages(files);
        }
      });
      comment.addEventListener("dragover", (event) => {
        event.preventDefault();
        comment.classList.add("over");
      });
      comment.addEventListener("dragleave", () =>
        comment.classList.remove("over")
      );
      comment.addEventListener("drop", (event) => {
        event.preventDefault();
        comment.classList.remove("over");
        addImages([...(event.dataTransfer?.files ?? [])]);
      });
      for (const button of el.querySelectorAll(".option")) {
        button.onclick = () => choose(button.dataset.key);
      }
      $("own").onclick = () => choose(undefined);
      if (called) {
        $("right").setAttribute(
          "aria-pressed",
          String(given?.choice === card.recommend)
        );
        $("wrong").setAttribute(
          "aria-pressed",
          String(given?.choice !== undefined && given.choice !== card.recommend)
        );
      }
      for (const picture of pictures.querySelectorAll(".frame")) {
        picture.onclick = () => {
          $("lightbox").replaceChildren(picture.cloneNode(true));
          $("lightbox").classList.add("open");
        };
      }
    }

    // The images added to the shown card's answer, by their path from the data directory.
    let images = [];
    const IMAGE_TYPES = ["image/png", "image/jpeg", "image/webp", "image/gif"];
    const REMOVE_ICON =
      '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>';

    function showImages() {
      const el = $("attached");
      el.innerHTML = images
        .map(
          (src, k) =>
            `<span class="thumb"><img alt="Added image ${k + 1}" src="/data/${encodeURI(src)}" /><button type="button" aria-label="Remove image ${k + 1}" data-k="${k}">${REMOVE_ICON}</button></span>`
        )
        .join("");
      for (const button of el.querySelectorAll("button")) {
        button.onclick = () => {
          images.splice(Number(button.dataset.k), 1);
          showImages();
        };
      }
    }

    /** Saves each image as it is added; it goes with the answer when the answer is sent. */
    async function addImages(files) {
      const card = deck.cards[at];
      const wrong = files.find((file) => !IMAGE_TYPES.includes(file.type));
      if (wrong) {
        $("saved").textContent =
          `${wrong.name || "That file"} is not a PNG, JPEG, WebP or GIF.`;
        return;
      }
      if (files.length === 0) {
        return;
      }
      $("saved").textContent = "Adding…";
      const saved = await Promise.all(
        files.map(async (file) => {
          const response = await fetch(
            `/api/image?id=${encodeURIComponent(card.id)}`,
            {
              body: file,
              headers: { "content-type": file.type },
              method: "POST",
            }
          );
          return { ok: response.ok, ...(await response.json()) };
        })
      );
      if (deck.cards[at] !== card) {
        return;
      }
      images.push(...saved.filter((r) => r.ok).map((r) => r.path));
      showImages();
      const failed = saved.find((r) => !r.ok);
      $("saved").textContent = failed
        ? `Not added: ${failed.message}`
        : "Added: it goes with your answer, an option or your own.";
    }

    /** What the line under the comment says: how to answer, or what was saved. */
    function savedLine(card, given) {
      if (given && given.choice === undefined) {
        return "Saved as your own answer.";
      }
      if (hasCall(card)) {
        return given
          ? "Saved."
          : `Press R if my call is right, W if it is wrong, or write your own and press ${MOD}↵; ← and → to move.`;
      }
      return given
        ? "Saved."
        : `Press 1–${card.options.length} to answer, or write your own and press ${MOD}↵; ← and → to move.`;
    }

    /**
     * Saves an answer and moves on: an option, with the comment if there is one, or with no option
     * (`key` undefined) the comment alone, as the person's own answer.
     */
    async function choose(key) {
      const card = deck.cards[at];
      const comment = $("comment").value;
      if (key === undefined && !comment.trim() && images.length === 0) {
        $("saved").textContent =
          "Write your answer or add an image first, or press a number.";
        $("comment").focus();
        return;
      }
      const response = await fetch("/api/answer", {
        body: JSON.stringify({ choice: key, comment, id: card.id, images }),
        headers: { "content-type": "application/json" },
        method: "POST",
      });
      if (!response.ok) {
        $("saved").textContent =
          `Not saved: ${(await response.json()).message}`;
        return;
      }
      answers[card.id] = {
        choice: key,
        comment: comment.trim() || undefined,
        images: images.length > 0 ? [...images] : undefined,
        label:
          key === undefined
            ? "Own answer"
            : card.options.find((o) => o.key === key).label,
        title: card.title,
      };
      show(at + 1);
    }

    // The theme the page is set to, kept in this browser only; without one it follows the system.
    const THEME_KEY = "decide-theme";
    const systemDark = () =>
      window.matchMedia("(prefers-color-scheme: dark)").matches;
    const isDark = () =>
      document.documentElement.dataset.theme === "dark" ||
      (document.documentElement.dataset.theme !== "light" && systemDark());
    const showTheme = () => {
      const label = isDark() ? "Light (T)" : "Dark (T)";
      $("theme").title = label;
      $("theme").setAttribute("aria-label", label);
    };
    const setTheme = (theme) => {
      document.documentElement.dataset.theme = theme;
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch {
        // Storage can be off (a private window); the switch still works for this visit.
      }
      showTheme();
    };
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    } catch {
      // No storage: follow the system.
    }
    showTheme();
    window
      .matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", showTheme);
    $("theme").onclick = () => setTheme(isDark() ? "light" : "dark");

    /** Keys in the comment: Escape leaves it, ⌘/Ctrl+Enter sends it as the answer. */
    function whileTyping(event) {
      if (event.key === "Escape") {
        event.target.blur();
      } else if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        choose(undefined);
      }
    }

    document.addEventListener("keydown", (event) => {
      if ($("lightbox").classList.contains("open")) {
        $("lightbox").classList.remove("open");
        return;
      }
      if (event.target.tagName === "TEXTAREA") {
        whileTyping(event);
        return;
      }
      if (event.key === "ArrowLeft") {
        show(at - 1);
      } else if (event.key === "ArrowRight") {
        show(at + 1);
      } else if (event.key === "Enter" && at === -1) {
        show(firstOpen());
      } else if (event.key.toLowerCase() === "t") {
        setTheme(isDark() ? "light" : "dark");
      } else if (event.key.toLowerCase() === "a") {
        show(deck.cards.length);
      } else if (
        (event.key.toLowerCase() === "r" || event.key.toLowerCase() === "w") &&
        hasCall(deck.cards[at])
      ) {
        choose(optionFor(deck.cards[at], event.key.toLowerCase() === "r"));
      } else if (event.key.toLowerCase() === "c" && $("comment")) {
        event.preventDefault();
        $("comment").focus();
      } else if (
        DIGIT_RE.test(event.key) &&
        at >= 0 &&
        at < deck.cards.length
      ) {
        const option = deck.cards[at].options[Number(event.key) - 1];
        if (option) {
          choose(option.key);
        }
      }
    });
    $("lightbox").onclick = () => $("lightbox").classList.remove("open");
    $("back").onclick = () => show(at - 1);
    $("next").onclick = () => show(at + 1);
    $("intro").onclick = () => show(-1);
    $("all").onclick = () => show(deck.cards.length);
    $("right").onclick = () => choose(optionFor(deck.cards[at], true));
    $("wrong").onclick = () => choose(optionFor(deck.cards[at], false));

    fetch("/api/session")
      .then((r) => r.json())
      .then((session) => {
        ({ answers, deck } = session);
        document.title = deck.title;
        show(deck.intro && answered() === 0 ? -1 : firstOpen());
      });
    </script>
  </body>
</html>
