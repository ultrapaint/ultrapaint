<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <title>Decisions</title>
    <style>
    /* Three text sizes: the title, the card's text (it is short, so it reads large) and the small
       text of controls, captions and status. Spacing takes the steps 4, 8, 12, 16, 24, 32. */
    :root {
      --bg: #f4f4f2;
      --card: #fff;
      --ink: #18181b;
      --muted: #66666e;
      --line: #e4e4e7;
      --line-strong: #a1a1aa;
      --field-edge: #8a8a93;
      --soft: #ececea;
      --accent: #2563eb;
      --on-accent: #fff;
      --mark: #e11d48;
      --error: #dc2626;
      --image-edge: rgb(0 0 0 / 0.1);
      --title: 600 26px / 1.25 var(--face);
      --read: 17px;
      --small: 14px;
      --face: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font: 400 var(--small) / 1.5 var(--face);
      color: var(--ink);
      color-scheme: light;
      background: var(--bg);
    }
    /* Dark follows the system unless the page is set to a theme (the bar's switch). */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121214;
        --card: #1c1c1f;
        --ink: #f4f4f5;
        --muted: #8c8c96;
        --line: #2f2f35;
        --line-strong: #5b5b66;
        --field-edge: #6e6e78;
        --soft: #17171a;
        --accent: #7aa5ff;
        --on-accent: #121214;
        --mark: #e11d48;
        --error: #f87171;
        --image-edge: rgb(255 255 255 / 0.1);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #121214;
      --card: #1c1c1f;
      --ink: #f4f4f5;
      --muted: #8c8c96;
      --line: #2f2f35;
      --line-strong: #5b5b66;
      --field-edge: #6e6e78;
      --soft: #17171a;
      --accent: #7aa5ff;
      --on-accent: #121214;
      --mark: #e11d48;
      --error: #f87171;
      --image-edge: rgb(255 255 255 / 0.1);
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* The card fills the window under the bar: its text on the left, its pictures on the right,
       each scrolling on its own so the question stays beside the picture being read. */
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-columns: minmax(0, 1fr);
      height: 100dvh;
      margin: 0;
      background: var(--bg);
    }
    main {
      display: grid;
      grid-template-columns: minmax(360px, 36%) minmax(0, 1fr);
      min-height: 0;
    }
    main.solo {
      grid-template-columns: minmax(0, 1fr);
    }
    .text {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-height: 0;
      padding: 32px;
      overflow-y: auto;
      font-size: var(--read);
    }
    main.solo .text {
      justify-self: center;
      width: min(760px, 100%);
    }
    .pictures {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
      gap: 16px;
      align-content: start;
      min-height: 0;
      padding: 32px 32px 32px 0;
      overflow-y: auto;
    }
    .pictures:empty {
      display: none;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .ghost {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      font-size: var(--small);
      font-weight: 500;
      white-space: nowrap;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .ghost:hover:not(:disabled) {
      border-color: var(--line-strong);
    }
    label.ghost {
      cursor: pointer;
    }
    .ghost:disabled {
      color: var(--line-strong);
      cursor: default;
    }
    .ghost[hidden] {
      display: none;
    }
    .primary {
      color: var(--on-accent);
      background: var(--accent);
      border-color: var(--accent);
    }
    .primary:hover:not(:disabled) {
      border-color: var(--accent);
      opacity: 0.9;
    }
    .ghost svg {
      width: 16px;
      height: 16px;
    }
    kbd {
      font: inherit;
      font-size: 12px;
      font-weight: 400;
      opacity: 0.7;
    }
    .primary kbd {
      opacity: 1;
    }
    .kicker {
      margin-bottom: 4px;
      font-size: var(--small);
      color: var(--muted);
    }
    h2 {
      margin: 0;
      font: var(--title);
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    .body {
      max-width: 65ch;
    }
    .body p {
      margin: 0 0 12px;
    }
    .body p:last-child {
      margin-bottom: 0;
    }
    .body ul {
      padding-left: 24px;
      margin: 0 0 12px;
    }
    .body li {
      margin: 4px 0;
    }
    code {
      padding: 2px 4px;
      font:
        0.85em / 1 ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
      background: rgb(127 127 127 / 0.16);
      border-radius: 4px;
    }
    /* A picture in its panel: the caption on top, the picture centred below it on a sunken
       well, so the two are told apart by their surfaces alone. */
    .shot {
      display: grid;
      grid-template-rows: auto 1fr;
      margin: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .shot figcaption {
      padding: 8px 12px;
      font-size: var(--small);
      text-wrap: pretty;
    }
    .shot figcaption b {
      font-weight: 600;
    }
    .stage {
      display: grid;
      place-items: center;
      padding: 12px;
      background: var(--soft);
      border-radius: 0 0 11px 11px;
    }
    /* The frame wraps the picture exactly, so a mark's fractions are fractions of the picture. */
    .frame {
      position: relative;
      max-width: 100%;
      cursor: zoom-in;
    }
    .frame img {
      display: block;
      max-width: 100%;
      max-height: calc(100dvh - 190px);
      outline: 1px solid var(--image-edge);
      outline-offset: -1px;
      border-radius: 4px;
    }
    .mark {
      position: absolute;
      border: 2px solid var(--mark);
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgb(255 255 255 / 0.6);
    }
    .mark span {
      position: absolute;
      bottom: calc(100% + 4px);
      left: -2px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      background: var(--mark);
      border-radius: 4px;
    }
    .mark.below span {
      top: calc(100% + 4px);
      bottom: auto;
    }
    .mark.right span {
      top: 50%;
      bottom: auto;
      left: calc(100% + 8px);
      transform: translateY(-50%);
    }
    .mark.inside span {
      top: 2px;
      bottom: auto;
      left: 2px;
    }
    /* The agent's own call, when it made one: what the person says is right or wrong. */
    .call {
      padding: 16px;
      background: var(--card);
      border-radius: 12px;
    }
    .call p {
      margin: 0 0 8px;
    }
    .call p:last-child {
      margin: 0;
    }
    .options {
      display: grid;
      gap: 8px;
    }
    .option {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 12px 16px;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .option:hover {
      border-color: var(--line-strong);
    }
    .option[aria-pressed="true"],
    .option.chosen {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .option.own {
      grid-template-columns: 24px 1fr;
      cursor: text;
    }
    .option.own.open:not(.chosen) {
      border-color: var(--line-strong);
    }
    .own-head {
      padding: 0;
      text-align: left;
      background: none;
      border: 0;
    }
    .hint {
      font-size: var(--small);
      color: var(--muted);
    }
    .hint[hidden] {
      display: none;
    }
    .field-label {
      font-size: var(--small);
      font-weight: 600;
    }
    /* The own answer's field shows once it is the choice: chosen, being written, or holding words. */
    .written {
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .field {
      display: grid;
      gap: 8px;
    }
    .own:not(.open) .field {
      display: none;
    }
    .key {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .option[aria-pressed="true"] .key,
    .option.chosen .key {
      color: var(--on-accent);
      background: var(--accent);
      border-color: var(--accent);
    }
    .label {
      font-weight: 600;
    }
    .then {
      font-size: var(--small);
      color: var(--muted);
    }
    .tag {
      padding: 2px 8px;
      margin-top: 2px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
      background: var(--soft);
      border-radius: 6px;
    }
    textarea {
      width: 100%;
      min-height: 72px;
      padding: 8px 12px;
      font: inherit;
      color: inherit;
      resize: vertical;
      background: var(--card);
      border: 1px solid var(--field-edge);
      border-radius: 8px;
    }
    textarea.over {
      border-color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .status {
      display: flex;
      gap: 12px;
      align-items: baseline;
      justify-content: space-between;
      min-height: 21px;
      margin-top: -8px;
    }
    .link {
      padding: 0;
      font-size: var(--small);
      color: var(--accent);
      white-space: nowrap;
      background: none;
      border: 0;
    }
    .link:hover {
      text-decoration: underline;
    }
    .saved {
      font-size: var(--small);
      color: var(--muted);
    }
    .saved.failed {
      color: var(--error);
    }
    /* Images added to the answer: thumbnails under the field, each with its remove. */
    .attached {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .attached:empty {
      display: none;
    }
    .thumb {
      position: relative;
    }
    .attached .thumb img {
      display: block;
      width: 88px;
      height: 64px;
      outline: 1px solid var(--image-edge);
      outline-offset: -1px;
      object-fit: cover;
      border-radius: 8px;
    }
    .thumb button {
      position: absolute;
      top: -8px;
      right: -8px;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      padding: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 50%;
    }
    .thumb svg {
      width: 12px;
      height: 12px;
    }
    .summary {
      display: grid;
      gap: 4px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      align-items: baseline;
      padding: 8px 12px;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 8px;
    }
    .row:hover {
      background: var(--card);
    }
    .row .answer {
      font-size: var(--small);
      color: var(--muted);
    }
    .row .answer.none {
      color: var(--ink);
    }
    .row .said {
      grid-column: 1 / -1;
      font-size: var(--small);
      color: var(--muted);
    }
    /* The bar: moving through the deck on the left, the progress and the page's switches on the
       right, and the share of cards answered as a line drawn over its bottom border. */
    .bar {
      position: relative;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .track {
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
    }
    .track i {
      display: block;
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s;
    }
    .count {
      min-width: 64px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
    }
    .spacer {
      flex: 1 1 0;
    }
    .progress {
      margin-right: 8px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
    }
    .ghost.icon {
      padding: 8px;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 24px;
      cursor: zoom-out;
      background: rgb(0 0 0 / 0.85);
    }
    .lightbox.open {
      display: grid;
    }
    .lightbox .frame {
      cursor: zoom-out;
    }
    .lightbox .frame img {
      max-height: calc(100dvh - 48px);
    }
    /* Narrower: one column that scrolls as a whole, the pictures under the text. */
    @media (max-width: 960px) {
      main,
      main.solo {
        display: block;
        overflow-y: auto;
      }
      .text,
      .pictures {
        overflow: visible;
      }
      .pictures {
        padding: 0 16px 24px;
      }
      .text {
        padding: 24px 16px;
      }
      main.solo .text {
        margin: 0 auto;
      }
    }
    @media (max-width: 640px) {
      .bar {
        padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      }
      .word,
      #intro,
      kbd,
      .progress,
      .spacer {
        display: none;
      }
      .count {
        flex: 1 1 auto;
      }
    }
    </style>
  </head>
  <body>
    <header class="bar">
      <button class="ghost" id="back" title="Previous (←)" type="button">
        <svg
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg><span class="word">Previous</span>
      </button>
      <span class="count" id="count"></span>
      <button class="ghost" id="next" title="Next (→)" type="button">
        <span class="word">Next</span
        ><svg
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </button>
      <span class="spacer"></span>
      <span class="progress" id="progress"></span>
      <button class="ghost" hidden id="intro" type="button">Intro</button>
      <button class="ghost" id="all" title="Every answer (A)" type="button">
        Answers <kbd>A</kbd>
      </button>
      <button
        class="ghost icon"
        id="theme"
        title="Light or dark (T)"
        type="button"
      ></button>
      <div aria-hidden="true" class="track"><i id="track"></i></div>
    </header>
    <main id="main">
      <section class="text" id="text">
        <p class="saved">Loading the deck…</p>
      </section>
      <section aria-label="Pictures" class="pictures" id="pictures"></section>
    </main>
    <div class="lightbox" id="lightbox"></div>
    <script>
    "use strict";
    /** The key that sends a comment as the answer, with Enter: ⌘ on a Mac, Ctrl elsewhere. */
    const MOD = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘" : "Ctrl+";
    const $ = (id) => document.getElementById(id);
    let deck;
    let answers = {};
    // -1 is the intro, cards.length the summary.
    let at = 0;

    const CODE_RE = /`([^`]+)`/g;
    const BOLD_RE = /\*\*([^*]+)\*\*/g;
    const BLOCK_RE = /\n\s*\n/;
    const DIGIT_RE = /^[1-9]$/;
    const esc = (s) =>
      s
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    const inline = (s) =>
      esc(s)
        .replace(CODE_RE, "<code>$1</code>")
        .replace(BOLD_RE, "<strong>$1</strong>");
    /** Paragraphs, `- ` lists, **bold** and `code`: what a deck's text uses. */
    const markdown = (text) =>
      text
        .trim()
        .split(BLOCK_RE)
        .map((block) => {
          const lines = block.split("\n");
          if (lines.every((l) => l.trim().startsWith("- "))) {
            return `<ul>${lines.map((l) => `<li>${inline(l.trim().slice(2))}</li>`).join("")}</ul>`;
          }
          return `<p>${inline(lines.join(" "))}</p>`;
        })
        .join("");

    const pct = (n) => `${(n * 100).toFixed(2)}%`;
    /** A picture with its marks: boxes around what the card asks about, each with its label. */
    const frame = (p) =>
      `<div class="frame"><img loading="lazy" src="/data/${encodeURI(p.src)}" alt="${esc(p.caption)}" />${(
        p.marks ?? []
      )
        .map(
          (m) =>
            `<div class="mark ${m.at ?? (m.y < 0.08 ? "inside" : "above")}" style="left:${pct(m.x)};top:${pct(m.y)};width:${pct(m.width)};height:${pct(m.height)}">${
              m.label ? `<span>${esc(m.label)}</span>` : ""
            }</div>`
        )
        .join("")}</div>`;
    /** A caption whose first part names the picture (`Figma 05.1/03 · Paused`): that part stands out. */
    const caption = (text) => {
      const cut = text.indexOf(" · ");
      return cut > 0 && cut < 60
        ? `<b>${esc(text.slice(0, cut))}</b> · ${esc(text.slice(cut + 3))}`
        : esc(text);
    };
    /** A card the agent made the call on: the person says only whether it is right. */
    const hasCall = (card) =>
      card?.proposal !== undefined &&
      card.options.length === 2 &&
      card.options.some((o) => o.key === card.recommend);
    /** The option a verdict on the call stands for: Right its own, Wrong the other. */
    const optionFor = (card, right) =>
      card.options.find((o) => (o.key === card.recommend) === right).key;
    /** What an answer said of the card's call, for the summary. */
    const ofCall = (card, a) => {
      if (!(hasCall(card) && a?.choice)) {
        return "";
      }
      return a.choice === card.recommend ? " · call right" : " · call wrong";
    };
    const answered = () => deck.cards.filter((c) => answers[c.id]).length;
    const firstOpen = () => {
      const i = deck.cards.findIndex((c) => !answers[c.id]);
      return i < 0 ? deck.cards.length : i;
    };

    function bar() {
      const n = deck.cards.length;
      $("progress").textContent = `${answered()} of ${n} answered`;
      $("track").style.width = `${(answered() / n) * 100}%`;
      // The intro and the summary say what they are in their heading; only a card has a place.
      $("count").textContent = at >= 0 && at < n ? `${at + 1} / ${n}` : "";
      $("all").disabled = at === n;
      $("back").disabled = at <= (deck.intro ? -1 : 0);
      $("next").disabled = at >= n;
      $("intro").hidden = !deck.intro || at === -1;
    }

    /** Shows the card, the intro or the summary: text on the left, the card's pictures beside it. */
    function show(i) {
      at = Math.max(deck.intro ? -1 : 0, Math.min(i, deck.cards.length));
      bar();
      const card = deck.cards[at];
      const el = $("text");
      const pictures = $("pictures");
      pictures.innerHTML = (card?.pictures ?? [])
        .map(
          (p) =>
            `<figure class="shot"><figcaption>${caption(p.caption)}</figcaption><div class="stage">${frame(p)}</div></figure>`
        )
        .join("");
      $("main").classList.toggle("solo", !card?.pictures?.length);
      for (const picture of pictures.querySelectorAll(".frame")) {
        picture.onclick = () => {
          $("lightbox").replaceChildren(picture.cloneNode(true));
          $("lightbox").classList.add("open");
        };
      }
      for (const scroller of [$("main"), el, pictures]) {
        scroller.scrollTop = 0;
      }
      if (at === -1) {
        showIntro(el);
      } else if (at === deck.cards.length) {
        showSummary(el);
      } else {
        showCard(el, card);
      }
    }

    function showIntro(el) {
      el.innerHTML = `<h2>${esc(deck.title)}</h2><div class="body">${markdown(deck.intro)}</div>
            <div><button type="button" class="ghost primary" id="start">Start <kbd>Enter</kbd></button></div>`;
      $("start").onclick = () => show(firstOpen());
    }

    function showSummary(el) {
      el.innerHTML = `<h2>Your answers</h2><div class="summary">${deck.cards
        .map((c, j) => {
          const a = answers[c.id];
          return `<button type="button" class="row" data-j="${j}"><span>${esc(c.title)}</span>
                  <span class="answer ${a ? "" : "none"}">${a ? esc(a.label + ofCall(c, a) + (a.images?.length ? ` · ${a.images.length} image${a.images.length === 1 ? "" : "s"}` : "")) : "Not answered"}</span>
                  ${a?.comment ? `<span class="said">“${esc(a.comment)}”</span>` : ""}</button>`;
        })
        .join("")}</div>`;
      for (const row of el.querySelectorAll(".row")) {
        row.onclick = () => show(Number(row.dataset.j));
      }
    }

    /**
     * Right and Wrong on a card's call, as options keyed R and W, each saying the option it stands
     * for when that option is named otherwise.
     */
    const verdicts = (card, given) =>
      `<div class="options">${[true, false]
        .map((right) => {
          const o = card.options.find((x) => x.key === optionFor(card, right));
          const word = right ? "Right" : "Wrong";
          const then = [o.label === word ? "" : o.label, o.leads ?? ""]
            .filter(Boolean)
            .join(" · ");
          return `<button type="button" class="option" data-key="${esc(o.key)}" aria-pressed="${given?.choice === o.key}">
                <span class="key">${word[0]}</span>
                <span><span class="label">${word}</span>${then ? `<br /><span class="then">${esc(then)}</span>` : ""}</span>
              </button>`;
        })
        .join("")}</div>`;

    /** A card: its text, its options and the person's own answer, or its call and a comment. */
    function showCard(el, card) {
      const called = hasCall(card);
      const given = answers[card.id];
      const own = given !== undefined && given.choice === undefined;
      // The words field: on a card with options, the last option, the person's own answer; on a
      // card with a call, a comment that goes with Right or Wrong, or the person's own answer.
      const field = (
        placeholder,
        value,
        sendLabel
      ) => `<div class="field">${called ? `<label class="field-label" for="comment">Comment</label>` : ""}<textarea ${called ? "" : 'aria-label="Your own answer" '}id="comment" placeholder="${placeholder}">${esc(value)}</textarea>
          ${called ? `<span class="hint" hidden id="hint">Esc, then R or W, sends it with your verdict; ${MOD}↵ sends it alone, as your own answer.</span>` : ""}
          <div class="attached" id="attached"></div>
          <div class="actions"><label class="ghost" for="pick">Add image</label>
          <input accept="image/png,image/jpeg,image/webp,image/gif" hidden id="pick" multiple type="file" />
          <button type="button" class="ghost" id="own">${sendLabel} <kbd>${MOD}↵</kbd></button></div></div>`;
      el.innerHTML = `
          <div>${card.eyebrow ? `<div class="kicker">${esc(card.eyebrow)}</div>` : ""}<h2>${esc(card.title)}</h2></div>
          ${called ? `<div class="call">${markdown(card.proposal)}</div>` : ""}
          ${card.body ? `<div class="body">${markdown(card.body)}</div>` : ""}
          ${
            called
              ? verdicts(card, given) +
                field(
                  "What I missed, or your own answer",
                  given?.comment ?? "",
                  "Send as my answer"
                )
              : `<div class="options">${card.options
                  .map(
                    (
                      o,
                      k
                    ) => `<button type="button" class="option" data-key="${esc(o.key)}" aria-pressed="${given?.choice === o.key}">
                <span class="key">${k + 1}</span>
                <span><span class="label">${esc(o.label)}</span>${o.leads ? `<br /><span class="then">${esc(o.leads)}</span>` : ""}</span>
                ${card.recommend === o.key ? `<span class="tag">Recommended</span>` : ""}
              </button>`
                  )
                  .join("")}
              <div class="option own${own ? " chosen open" : ""}" id="ownrow"><span class="key">${card.options.length + 1}</span>
              <div class="written"><button type="button" class="own-head label" id="ownhead">Your own answer</button>
              ${field("What you want instead. Paste or drop images here too", own ? (given.comment ?? "") : "", "Send")}</div></div></div>`
          }
          <div class="status"><span class="saved" id="saved" role="status">${savedLine(given)}</span>
          ${given ? `<button type="button" class="link" id="clear">Clear answer <kbd>⌫</kbd></button>` : ""}</div>`;
      images = called || own ? [...(given?.images ?? [])] : [];
      showImages();
      wireField();
      for (const button of el.querySelectorAll("button.option")) {
        button.onclick = () => choose(button.dataset.key);
      }
      $("own").onclick = () => choose(undefined);
      if (given) {
        $("clear").onclick = clearAnswer;
      }
      if (called) {
        const showHint = () => {
          $("hint").hidden = !$("comment").value.trim();
        };
        $("comment").addEventListener("input", showHint);
        showHint();
      } else {
        $("ownhead").onclick = openField;
        $("ownrow").onclick = (event) => {
          if (!event.target.closest("button, label, textarea, input")) {
            openField();
          }
        };
      }
    }

    /** The words field takes images too: picked, pasted or dropped on it. */
    function wireField() {
      $("pick").onchange = (event) => {
        addImages([...event.target.files]);
        event.target.value = "";
      };
      const comment = $("comment");
      comment.addEventListener("paste", (event) => {
        const files = [...(event.clipboardData?.files ?? [])];
        if (files.length > 0) {
          event.preventDefault();
          addImages(files);
        }
      });
      comment.addEventListener("dragover", (event) => {
        event.preventDefault();
        comment.classList.add("over");
      });
      comment.addEventListener("dragleave", () =>
        comment.classList.remove("over")
      );
      comment.addEventListener("drop", (event) => {
        event.preventDefault();
        comment.classList.remove("over");
        addImages([...(event.dataTransfer?.files ?? [])]);
      });
    }

    // The images added to the shown card's answer, by their path from the data directory.
    let images = [];
    const IMAGE_TYPES = ["image/png", "image/jpeg", "image/webp", "image/gif"];
    const REMOVE_ICON =
      '<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>';

    function showImages() {
      const el = $("attached");
      el.innerHTML = images
        .map(
          (src, k) =>
            `<span class="thumb"><img alt="Added image ${k + 1}" src="/data/${encodeURI(src)}" /><button type="button" aria-label="Remove image ${k + 1}" data-k="${k}">${REMOVE_ICON}</button></span>`
        )
        .join("");
      for (const button of el.querySelectorAll("button")) {
        button.onclick = () => {
          images.splice(Number(button.dataset.k), 1);
          showImages();
        };
      }
    }

    /** The line under the answer: what was saved, or what went wrong and what to do. */
    const say = (text, failed = false) => {
      $("saved").textContent = text;
      $("saved").classList.toggle("failed", failed);
    };

    /** A request to the deck's server, its reply or why there is none. */
    async function send(url, init) {
      try {
        const response = await fetch(url, init);
        return { ok: response.ok, ...(await response.json()) };
      } catch {
        return {
          message:
            "the deck's server isn't answering. Start `pnpm evals decide` again and retry",
          ok: false,
        };
      }
    }

    /** Opens the person's own answer and puts the cursor in it. */
    function openField() {
      $("ownrow")?.classList.add("open");
      $("comment").focus();
    }

    /** Saves each image as it is added; it goes with the answer when the answer is sent. */
    async function addImages(files) {
      const card = deck.cards[at];
      const wrong = files.find((file) => !IMAGE_TYPES.includes(file.type));
      if (wrong) {
        say(
          `${wrong.name || "That file"} is not a PNG, JPEG, WebP or GIF.`,
          true
        );
        return;
      }
      if (files.length === 0) {
        return;
      }
      $("ownrow")?.classList.add("open");
      say("Adding…");
      const saved = await Promise.all(
        files.map((file) =>
          send(`/api/image?id=${encodeURIComponent(card.id)}`, {
            body: file,
            headers: { "content-type": file.type },
            method: "POST",
          })
        )
      );
      if (deck.cards[at] !== card) {
        return;
      }
      images.push(...saved.filter((r) => r.ok).map((r) => r.path));
      showImages();
      const failed = saved.find((r) => !r.ok);
      say(failed ? `Not added: ${failed.message}.` : "", Boolean(failed));
    }

    /** What the line under the answer says once the card is answered. */
    function savedLine(given) {
      if (given === undefined) {
        return "";
      }
      return given.choice === undefined ? "Saved as your own answer" : "Saved";
    }

    /**
     * Saves an answer and moves on: an option, with the comment if there is one, or with no option
     * (`key` undefined) the comment alone, as the person's own answer.
     */
    async function choose(key) {
      const card = deck.cards[at];
      // The words and images go with Right or Wrong, but are an answer of their own beside options.
      const withWords = key === undefined || hasCall(card);
      const comment = withWords ? $("comment").value : "";
      const sent = withWords ? images : [];
      if (key === undefined && !comment.trim() && images.length === 0) {
        say("Write your answer or add an image, then send it.", true);
        openField();
        return;
      }
      const reply = await send("/api/answer", {
        body: JSON.stringify({
          choice: key,
          comment,
          id: card.id,
          images: sent,
        }),
        headers: { "content-type": "application/json" },
        method: "POST",
      });
      if (!reply.ok) {
        say(`Not saved: ${reply.message}.`, true);
        return;
      }
      answers[card.id] = {
        choice: key,
        comment: comment.trim() || undefined,
        images: sent.length > 0 ? [...sent] : undefined,
        label:
          key === undefined
            ? "Own answer"
            : card.options.find((o) => o.key === key).label,
        title: card.title,
      };
      show(at + 1);
    }

    /** Takes the card's answer back: it is unanswered again. */
    async function clearAnswer() {
      const card = deck.cards[at];
      if (!answers[card?.id]) {
        return;
      }
      const reply = await send(
        `/api/answer?id=${encodeURIComponent(card.id)}`,
        {
          method: "DELETE",
        }
      );
      if (!reply.ok) {
        say(`Not cleared: ${reply.message}.`, true);
        return;
      }
      const taken = answers[card.id];
      delete answers[card.id];
      show(at);
      $("saved").innerHTML =
        'Answer cleared · <button type="button" class="link" id="undo">Undo</button>';
      $("undo").onclick = () => restore(card, taken);
    }

    /** Puts a cleared answer back as it was, words and images with it. */
    async function restore(card, answer) {
      const reply = await send("/api/answer", {
        body: JSON.stringify({
          choice: answer.choice,
          comment: answer.comment,
          id: card.id,
          images: answer.images ?? [],
        }),
        headers: { "content-type": "application/json" },
        method: "POST",
      });
      if (!reply.ok) {
        say(`Not restored: ${reply.message}.`, true);
        return;
      }
      answers[card.id] = answer;
      if (deck.cards[at] === card) {
        show(at);
      }
    }

    // The theme the page is set to, kept in this browser only; without one it follows the system.
    const THEME_KEY = "decide-theme";
    const systemDark = () =>
      window.matchMedia("(prefers-color-scheme: dark)").matches;
    const isDark = () =>
      document.documentElement.dataset.theme === "dark" ||
      (document.documentElement.dataset.theme !== "light" && systemDark());
    const ICON = (paths) =>
      `<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">${paths}</svg>`;
    // The switch shows the theme it turns on: the sun in the dark, the moon in the light.
    const SUN = ICON(
      '<circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />'
    );
    const MOON = ICON('<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />');
    const showTheme = () => {
      $("theme").innerHTML = isDark() ? SUN : MOON;
      const label = isDark() ? "Light theme (T)" : "Dark theme (T)";
      $("theme").title = label;
      $("theme").setAttribute("aria-label", label);
    };
    const setTheme = (theme) => {
      document.documentElement.dataset.theme = theme;
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch {
        // Storage can be off (a private window); the switch still works for this visit.
      }
      showTheme();
    };
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    } catch {
      // No storage: follow the system.
    }
    showTheme();
    window
      .matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", showTheme);
    $("theme").onclick = () => setTheme(isDark() ? "light" : "dark");

    /** Keys in the comment: Escape leaves it, ⌘/Ctrl+Enter sends it as the answer. */
    function whileTyping(event) {
      if (event.key === "Escape") {
        event.target.blur();
        // An own answer left empty closes again.
        const row = $("ownrow");
        if (
          row &&
          !row.classList.contains("chosen") &&
          !event.target.value.trim() &&
          images.length === 0
        ) {
          row.classList.remove("open");
        }
      } else if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        choose(undefined);
      }
    }

    /** A key the page's shortcuts leave alone: it closes the picture, is typed, or is the browser's. */
    function notAShortcut(event) {
      if ($("lightbox").classList.contains("open")) {
        $("lightbox").classList.remove("open");
        return true;
      }
      if (event.target.tagName === "TEXTAREA") {
        whileTyping(event);
        return true;
      }
      // ⌘C, Ctrl+R and the like are the browser's.
      return event.metaKey || event.ctrlKey || event.altKey;
    }

    document.addEventListener("keydown", (event) => {
      if (notAShortcut(event)) {
        return;
      }
      if (event.key === "ArrowLeft") {
        show(at - 1);
      } else if (event.key === "ArrowRight") {
        show(at + 1);
      } else if (event.key === "Enter" && at === -1) {
        show(firstOpen());
      } else if (event.key.toLowerCase() === "t") {
        setTheme(isDark() ? "light" : "dark");
      } else if (event.key.toLowerCase() === "a") {
        show(deck.cards.length);
      } else if (
        (event.key.toLowerCase() === "r" || event.key.toLowerCase() === "w") &&
        hasCall(deck.cards[at])
      ) {
        choose(optionFor(deck.cards[at], event.key.toLowerCase() === "r"));
      } else if (event.key.toLowerCase() === "c" && $("comment")) {
        event.preventDefault();
        openField();
      } else if (event.key === "Backspace" || event.key === "Delete") {
        clearAnswer();
      } else if (
        DIGIT_RE.test(event.key) &&
        at >= 0 &&
        at < deck.cards.length
      ) {
        pressDigit(event, deck.cards[at]);
      }
    });

    /** A number key picks its option; the one after the last opens the person's own answer. */
    function pressDigit(event, card) {
      // A card with a call is answered by R and W alone, the keys its buttons show.
      if (hasCall(card)) {
        return;
      }
      const n = Number(event.key);
      const option = card.options[n - 1];
      if (option) {
        choose(option.key);
      } else if (n === card.options.length + 1) {
        event.preventDefault();
        openField();
      }
    }
    $("lightbox").onclick = () => $("lightbox").classList.remove("open");
    $("back").onclick = () => show(at - 1);
    $("next").onclick = () => show(at + 1);
    $("intro").onclick = () => show(-1);
    $("all").onclick = () => show(deck.cards.length);

    send("/api/session").then((session) => {
      if (!session.ok) {
        $("text").innerHTML =
          `<p class="saved failed">Couldn't load the deck: ${esc(session.message)}, then reload this page.</p>`;
        return;
      }
      ({ answers, deck } = session);
      document.title = deck.title;
      show(deck.intro && answered() === 0 ? -1 : firstOpen());
    });
    </script>
  </body>
</html>
