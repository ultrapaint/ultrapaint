<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <title>Decisions</title>
    <style>
    :root {
      --bg: #f4f4f2;
      --card: #fff;
      --ink: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --soft: #f4f4f5;
      --accent: #2563eb;
      --radius: 14px;
      font:
        15px / 1.5 ui-sans-serif,
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    * {
      box-sizing: border-box;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      grid-template-columns: minmax(0, 1fr);
      min-height: 100dvh;
      margin: 0;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 12px 20px;
      background: var(--bg);
    }
    header h1 {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }
    .progress {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
    }
    .bar {
      flex: 0 0 140px;
      height: 4px;
      overflow: hidden;
      background: var(--line);
      border-radius: 2px;
    }
    .bar i {
      display: block;
      width: 0;
      height: 100%;
      background: var(--ink);
      transition: width 0.2s;
    }
    .nav {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .ghost {
      padding: 6px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .ghost:disabled {
      color: #a1a1aa;
      cursor: default;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      padding: 0 20px 40px;
    }
    .card {
      display: grid;
      gap: 20px;
      align-self: start;
      width: min(1100px, 100%);
      padding: 28px 32px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow:
        0 1px 2px rgb(0 0 0 / 0.06),
        0 8px 30px rgb(0 0 0 / 0.06);
    }
    .eyebrow {
      font-size: 13px;
      color: var(--muted);
    }
    h2 {
      margin: 2px 0 0;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.3;
      text-wrap: balance;
    }
    .body {
      max-width: 72ch;
    }
    .body p {
      margin: 0 0 10px;
    }
    .body ul {
      padding-left: 20px;
      margin: 0 0 10px;
    }
    .body li {
      margin: 2px 0;
    }
    .body code {
      padding: 2px 5px;
      font:
        13px / 1 ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
      background: var(--soft);
      border-radius: 4px;
    }
    .pictures {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }
    figure {
      display: grid;
      gap: 6px;
      margin: 0;
    }
    figure img {
      width: 100%;
      max-height: 420px;
      cursor: zoom-in;
      object-fit: contain;
      background: #18181b;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    figcaption {
      font-size: 13px;
      color: var(--muted);
    }
    .options {
      display: grid;
      gap: 8px;
    }
    .option {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 12px 14px;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .option:hover {
      border-color: #a1a1aa;
    }
    .option[aria-pressed="true"] {
      border-color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--ink);
    }
    .key {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: var(--soft);
      border-radius: 6px;
    }
    .option[aria-pressed="true"] .key {
      color: #fff;
      background: var(--ink);
    }
    .label {
      font-weight: 600;
    }
    .then {
      font-size: 14px;
      color: var(--muted);
    }
    .tag {
      padding-top: 2px;
      font-size: 12px;
      color: var(--accent);
      white-space: nowrap;
    }
    textarea {
      width: 100%;
      min-height: 64px;
      padding: 10px 12px;
      font: inherit;
      color: inherit;
      resize: vertical;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .hint {
      font-size: 13px;
      color: var(--muted);
    }
    .summary {
      display: grid;
      gap: 2px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: baseline;
      padding: 10px 12px;
      text-align: left;
      background: none;
      border: 0;
      border-radius: 8px;
    }
    .row:hover {
      background: var(--soft);
    }
    .row .answer {
      color: var(--muted);
    }
    .row .answer.none {
      color: #dc2626;
    }
    .row .said {
      grid-column: 1 / -1;
      font-size: 14px;
      color: var(--muted);
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 20px;
      cursor: zoom-out;
      background: rgb(0 0 0 / 0.85);
    }
    .lightbox.open {
      display: grid;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .saved {
      min-height: 18px;
      font-size: 13px;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      header {
        flex-wrap: wrap;
        gap: 4px 12px;
        padding: 10px 12px;
      }
      header h1 {
        flex: 1 1 100%;
      }
      main {
        padding: 0 8px 24px;
      }
      .card {
        padding: 20px 16px;
      }
      .bar {
        display: none;
      }
      .pictures {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Decisions</h1>
      <span class="progress" id="progress"></span>
      <span class="bar"><i id="bar"></i></span>
      <span class="nav">
        <button class="ghost" id="back" title="Previous (←)" type="button">
          ←
        </button>
        <button class="ghost" id="next" title="Next (→)" type="button">
          →
        </button>
        <button class="ghost" id="all" title="Every answer (A)" type="button">
          All
        </button>
      </span>
    </header>
    <main><div class="card" id="card"></div></main>
    <div class="lightbox" id="lightbox"><img alt="" id="zoomed"></div>
    <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    let deck;
    let answers = {};
    // -1 is the intro, cards.length the summary.
    let at = 0;

    const CODE_RE = /`([^`]+)`/g;
    const BOLD_RE = /\*\*([^*]+)\*\*/g;
    const BLOCK_RE = /\n\s*\n/;
    const DIGIT_RE = /^[1-9]$/;
    const esc = (s) =>
      s
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    const inline = (s) =>
      esc(s)
        .replace(CODE_RE, "<code>$1</code>")
        .replace(BOLD_RE, "<strong>$1</strong>");
    /** Paragraphs, `- ` lists, **bold** and `code`: what a deck's text uses. */
    const markdown = (text) =>
      text
        .trim()
        .split(BLOCK_RE)
        .map((block) => {
          const lines = block.split("\n");
          if (lines.every((l) => l.trim().startsWith("- "))) {
            return `<ul>${lines.map((l) => `<li>${inline(l.trim().slice(2))}</li>`).join("")}</ul>`;
          }
          return `<p>${inline(lines.join(" "))}</p>`;
        })
        .join("");

    const answered = () => deck.cards.filter((c) => answers[c.id]).length;
    const firstOpen = () => {
      const i = deck.cards.findIndex((c) => !answers[c.id]);
      return i < 0 ? deck.cards.length : i;
    };

    function header() {
      const n = deck.cards.length;
      $("progress").textContent = `${answered()} of ${n} answered`;
      $("bar").style.width = `${(answered() / n) * 100}%`;
      $("back").disabled = at <= (deck.intro ? -1 : 0);
      $("next").disabled = at >= n;
    }

    function show(i) {
      at = Math.max(deck.intro ? -1 : 0, Math.min(i, deck.cards.length));
      header();
      const el = $("card");
      if (at === -1) {
        el.innerHTML = `<h2>${esc(deck.title)}</h2><div class="body">${markdown(deck.intro)}</div>
            <div><button type="button" class="ghost" id="start">Start (Enter)</button></div>`;
        $("start").onclick = () => show(firstOpen());
        return;
      }
      if (at === deck.cards.length) {
        el.innerHTML = `<div><div class="eyebrow">${answered()} of ${deck.cards.length} answered · saved as you went</div>
            <h2>Your answers</h2></div><div class="summary">${deck.cards
              .map((c, j) => {
                const a = answers[c.id];
                return `<button type="button" class="row" data-j="${j}"><span>${esc(c.title)}</span>
                  <span class="answer ${a ? "" : "none"}">${a ? esc(a.label) : "not answered"}</span>
                  ${a?.comment ? `<span class="said">“${esc(a.comment)}”</span>` : ""}</button>`;
              })
              .join("")}</div>`;
        for (const row of el.querySelectorAll(".row")) {
          row.onclick = () => show(Number(row.dataset.j));
        }
        return;
      }
      const card = deck.cards[at];
      const given = answers[card.id];
      el.innerHTML = `
          <div>${card.eyebrow ? `<div class="eyebrow">${esc(card.eyebrow)}</div>` : ""}<h2>${esc(card.title)}</h2></div>
          ${card.body ? `<div class="body">${markdown(card.body)}</div>` : ""}
          ${
            card.pictures?.length
              ? `<div class="pictures">${card.pictures
                  .map(
                    (
                      p
                    ) => `<figure><img loading="lazy" src="/data/${encodeURI(p.src)}" alt="${esc(p.caption)}" />
                    <figcaption>${esc(p.caption)}</figcaption></figure>`
                  )
                  .join("")}</div>`
              : ""
          }
          <div class="options">${card.options
            .map(
              (
                o,
                k
              ) => `<button type="button" class="option" data-key="${esc(o.key)}" aria-pressed="${given?.choice === o.key}">
                <span class="key">${k + 1}</span>
                <span><span class="label">${esc(o.label)}</span>${o.leads ? `<br /><span class="then">${esc(o.leads)}</span>` : ""}</span>
                ${card.recommend === o.key ? `<span class="tag">Recommended</span>` : ""}
              </button>`
            )
            .join("")}</div>
          <div><textarea id="comment" placeholder="A comment, if there is something to say (optional)">${esc(given?.comment ?? "")}</textarea>
          <div class="saved" id="saved">${given ? "Saved." : `Press 1–${card.options.length} to answer and go on; ← and → to move.`}</div></div>`;
      for (const button of el.querySelectorAll(".option")) {
        button.onclick = () => choose(button.dataset.key);
      }
      for (const img of el.querySelectorAll("figure img")) {
        img.onclick = () => {
          $("zoomed").src = img.src;
          $("lightbox").classList.add("open");
        };
      }
      window.scrollTo(0, 0);
    }

    async function choose(key) {
      const card = deck.cards[at];
      const comment = $("comment").value;
      const response = await fetch("/api/answer", {
        body: JSON.stringify({ choice: key, comment, id: card.id }),
        headers: { "content-type": "application/json" },
        method: "POST",
      });
      if (!response.ok) {
        $("saved").textContent =
          `Not saved: ${(await response.json()).message}`;
        return;
      }
      const { label } = card.options.find((o) => o.key === key);
      answers[card.id] = {
        choice: key,
        comment: comment.trim() || undefined,
        label,
        title: card.title,
      };
      show(at + 1);
    }

    document.addEventListener("keydown", (event) => {
      if ($("lightbox").classList.contains("open")) {
        $("lightbox").classList.remove("open");
        return;
      }
      const typing = event.target.tagName === "TEXTAREA";
      if (typing) {
        if (event.key === "Escape") {
          event.target.blur();
        }
        return;
      }
      if (event.key === "ArrowLeft") {
        show(at - 1);
      } else if (event.key === "ArrowRight") {
        show(at + 1);
      } else if (event.key === "Enter" && at === -1) {
        show(firstOpen());
      } else if (event.key.toLowerCase() === "a") {
        show(deck.cards.length);
      } else if (event.key.toLowerCase() === "c" && $("comment")) {
        event.preventDefault();
        $("comment").focus();
      } else if (
        DIGIT_RE.test(event.key) &&
        at >= 0 &&
        at < deck.cards.length
      ) {
        const option = deck.cards[at].options[Number(event.key) - 1];
        if (option) {
          choose(option.key);
        }
      }
    });
    $("lightbox").onclick = () => $("lightbox").classList.remove("open");
    $("back").onclick = () => show(at - 1);
    $("next").onclick = () => show(at + 1);
    $("all").onclick = () => show(deck.cards.length);

    fetch("/api/session")
      .then((r) => r.json())
      .then((session) => {
        ({ answers, deck } = session);
        document.title = deck.title;
        $("title").textContent = deck.title;
        show(deck.intro && answered() === 0 ? -1 : firstOpen());
      });
    </script>
  </body>
</html>
