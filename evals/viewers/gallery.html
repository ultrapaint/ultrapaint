<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    >
    <title>Choose references</title>
    <style>
    :root {
      --bg: #f4f4f2;
      --card: #fff;
      --ink: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --no: #dc2626;
      --yes: #16a34a;
      font:
        14px / 1.45 ui-sans-serif,
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    * {
      box-sizing: border-box;
    }
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-columns: minmax(0, 1fr);
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }
    body.grid-mode {
      height: auto;
      overflow: auto;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      padding: 12px 20px;
      background: rgb(244 244 242 / 0.94);
      backdrop-filter: blur(8px);
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    .count {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .bar {
      flex: 0 0 140px;
      height: 4px;
      overflow: hidden;
      background: var(--line);
      border-radius: 2px;
    }
    .bar i {
      display: block;
      width: 0;
      height: 100%;
      background: var(--ink);
    }
    .head-button {
      flex: none;
      padding: 6px 12px;
      font: inherit;
      color: var(--ink);
      cursor: pointer;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .head-button:disabled {
      color: #a1a1aa;
      cursor: default;
    }
    .chips {
      display: flex;
      gap: 4px;
      max-width: 100%;
      margin-left: auto;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips button {
      flex: none;
      padding: 6px 10px;
      font: inherit;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: 0;
      border-radius: 8px;
    }
    .chips button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--card);
      box-shadow: 0 0 0 1px var(--line);
    }
    /* The deck: one shot at a time. */
    .deck {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      min-height: 0;
      padding: 0 20px 34px;
    }
    .card {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-columns: minmax(0, 1fr);
      width: min(1400px, 100%);
      height: 100%;
      overflow: hidden;
      touch-action: pan-y;
      background: var(--card);
      border-radius: 14px;
      box-shadow:
        0 1px 2px rgb(0 0 0 / 0.06),
        0 8px 30px rgb(0 0 0 / 0.06);
      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }
    .card.dragging {
      transition: none;
    }
    .picture {
      display: grid;
      place-items: center;
      min-height: 0;
      overflow: auto;
      background: #fafafa;
    }
    .picture img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }
    .bottom {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto;
      gap: 10px 14px;
      align-items: center;
      padding: 12px 16px 14px;
    }
    .title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .title b {
      font-weight: 600;
    }
    .title span,
    .title a {
      color: var(--muted);
    }
    .note {
      width: 100%;
      padding: 9px 12px;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .actions button {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .actions button > kbd {
      font:
        11px ui-monospace,
        monospace;
      color: var(--muted);
    }
    .actions .no:hover,
    .actions .no.chosen {
      color: var(--no);
      border-color: var(--no);
    }
    .actions .yes:hover,
    .actions .yes.chosen {
      color: var(--yes);
      border-color: var(--yes);
    }
    .stamp {
      position: absolute;
      top: 24px;
      z-index: 2;
      padding: 6px 14px;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      pointer-events: none;
      background: rgb(255 255 255 / 0.85);
      border: 3px solid;
      border-radius: 8px;
      opacity: 0;
    }
    .stamp.no {
      left: 24px;
      color: var(--no);
      transform: rotate(-8deg);
    }
    .stamp.yes {
      right: 24px;
      color: var(--yes);
      transform: rotate(8deg);
    }
    .used {
      position: absolute;
      top: 14px;
      left: 50%;
      padding: 2px 10px;
      font-size: 12px;
      color: #fff;
      background: rgb(24 24 27 / 0.75);
      border-radius: 6px;
      transform: translateX(-50%);
    }
    .done {
      color: var(--muted);
      text-align: center;
    }
    .done h2 {
      font-size: 20px;
      color: var(--ink);
    }
    .help {
      position: fixed;
      bottom: 6px;
      left: 20px;
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }
    p.help kbd {
      padding: 0 4px;
      font:
        11px ui-monospace,
        monospace;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    /* The grid: everything at once, to look over what was taken. */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      padding: 4px 20px 40px;
    }
    .shot {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 0 0 1px var(--line);
    }
    .shot.taken {
      box-shadow: 0 0 0 3px var(--yes);
    }
    .shot.skipped {
      opacity: 0.45;
    }
    .shot img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #eee;
    }
    .shot p {
      padding: 8px 10px 10px;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      white-space: nowrap;
    }
    .shot p span {
      color: var(--muted);
    }
    @media (max-width: 760px) {
      header {
        padding: 10px 12px;
      }
      header h1 {
        display: none;
      }
      .bar {
        flex: 1 1 auto;
      }
      .chips {
        order: 3;
        width: 100%;
        margin: 0;
      }
      .deck {
        padding: 0 8px calc(8px + env(safe-area-inset-bottom));
      }
      .bottom {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        padding: 10px;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
      }
      .actions button {
        justify-content: center;
        min-height: 48px;
      }
      .actions button > kbd {
        display: none;
      }
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 4px 8px 40px;
      }
    }
    @media (max-width: 760px), (pointer: coarse) {
      .help {
        display: none;
      }
    }
    </style>
  </head>
  <body>
    <header>
      <h1>Choose references</h1>
      <span class="count" id="count"></span>
      <span class="bar"><i id="bar"></i></span>
      <button class="head-button" disabled id="back" type="button">
        ← Back
      </button>
      <nav class="chips" id="chips"></nav>
    </header>
    <main id="main"></main>
    <p class="help">
      <kbd>→</kbd>
      take · <kbd>←</kbd> skip · <kbd>↓</kbd> later · <kbd>Z</kbd>
      back · <kbd>N</kbd> note, then <kbd>Ctrl</kbd>+arrow to answer with it
    </p>
    <script>
    "use strict";
    // Pieces of UI worth learning from: a screen, a section, a modal, a menu, a form.
    const VIEWS = [
      ["deck", "To decide"],
      ["taken", "Taken"],
      ["skipped", "Skipped"],
      ["used", "In use"],
      ["all", "All"],
    ];
    const state = {
      history: [],
      later: new Set(),
      revisit: null,
      shots: [],
      skipped: new Set(),
      taken: new Map(),
      used: new Set(),
      view: "deck",
    };
    const $ = (id) => document.getElementById(id);
    const el = (tag, props = {}, children = []) => {
      const node = Object.assign(document.createElement(tag), props);
      for (const child of [].concat(children)) {
        if (child !== null && child !== undefined) {
          node.append(child);
        }
      }
      return node;
    };
    const sized = (url, size) => `${url}?resize=${size}&vertical=center`;
    const decided = (href) => state.taken.has(href) || state.skipped.has(href);

    async function load() {
      const session = await (await fetch("/api/gallery")).json();
      state.shots = session.shots;
      state.used = new Set(session.used);
      state.words = session.words;
      document.querySelector("h1").textContent = state.words.heading;
      document.title = state.words.heading;
      state.taken = new Map(
        session.selection.selected.map((s) => [s.href, s.note ?? ""])
      );
      state.skipped = new Set(session.selection.rejected ?? []);
      render();
    }

    /** The shots still to decide, those put off for later at the end. */
    function deck() {
      const left = state.shots.filter(
        (s) => !decided(s.href) || s.href === state.revisit
      );
      const now = left.filter((s) => !state.later.has(s.href));
      const later = left.filter((s) => state.later.has(s.href));
      const revisited = left.find((s) => s.href === state.revisit);
      const rest = [...now, ...later].filter((s) => s !== revisited);
      return revisited ? [revisited, ...rest] : rest;
    }

    async function decide(decision) {
      const [shot] = deck();
      if (!shot) {
        return;
      }
      const note = document.querySelector(".note")?.value ?? "";
      if (decision === "later") {
        state.later.add(shot.href);
        state.revisit = null;
        fly(0);
        setTimeout(render, 160);
        return;
      }
      const response = await fetch("/api/gallery", {
        body: JSON.stringify({ decision, href: shot.href, note }),
        headers: { "content-type": "application/json" },
        method: "POST",
      });
      if (!response.ok) {
        $("count").textContent =
          `Not saved: ${(await response.json()).message}`;
        return;
      }
      state.taken.delete(shot.href);
      state.skipped.delete(shot.href);
      if (decision === "take") {
        state.taken.set(shot.href, note);
      } else {
        state.skipped.add(shot.href);
      }
      state.later.delete(shot.href);
      state.history = [
        ...state.history.filter((h) => h !== shot.href),
        shot.href,
      ];
      state.revisit = null;
      fly(decision === "take" ? 1 : -1);
      setTimeout(render, 180);
    }

    function fly(dx) {
      const node = document.querySelector(".card");
      if (node) {
        node.style.transform = `translate(${dx * 120}%, ${dx === 0 ? 40 : 0}px) rotate(${dx * 12}deg)`;
        node.style.opacity = "0";
      }
    }

    /** The last decision shown again, to be decided again. */
    function back() {
      const href = state.history.pop();
      if (!href) {
        return;
      }
      state.revisit = href;
      state.view = "deck";
      render();
    }

    function header() {
      const total = state.shots.length;
      const done = state.taken.size + state.skipped.size;
      $("count").textContent =
        `${done} of ${total} decided · ${state.taken.size} ${state.words.taken.toLowerCase()}`;
      $("bar").style.width = `${(100 * done) / Math.max(1, total)}%`;
      $("back").disabled = state.history.length === 0;
      const counts = {
        all: total,
        deck: total - done,
        skipped: state.skipped.size,
        taken: state.taken.size,
        used: state.used.size,
      };
      $("chips").replaceChildren(
        ...VIEWS.filter(([key]) => key !== "used" || state.used.size > 0).map(
          ([key, name]) => {
            const label = key === "taken" ? state.words.taken : name;
            const b = el("button", {
              onclick: () => {
                state.view = key;
                render();
              },
              textContent: `${label} ${counts[key]}`,
            });
            b.setAttribute("aria-pressed", String(state.view === key));
            return b;
          }
        )
      );
    }

    function render() {
      header();
      document.body.classList.toggle("grid-mode", state.view !== "deck");
      if (state.view === "deck") {
        renderCard();
      } else {
        renderGrid();
      }
    }

    function decisionButton(shot, decision, cls, label, key) {
      const b = el(
        "button",
        { className: cls, onclick: () => decide(decision) },
        [label, el("kbd", { textContent: key })]
      );
      const chosen =
        (decision === "take" && state.taken.has(shot.href)) ||
        (decision === "skip" && state.skipped.has(shot.href));
      if (chosen) {
        b.classList.add("chosen");
      }
      return b;
    }

    function renderCard() {
      const [shot] = deck();
      const main = $("main");
      main.className = "deck";
      if (!shot) {
        main.replaceChildren(
          el("div", { className: "done" }, [
            el("h2", { textContent: "Every shot is decided" }),
            el("p", { textContent: "The ones taken become references next." }),
          ])
        );
        return;
      }
      const node = el("article", { className: "card" }, [
        el("div", { className: "stamp no", textContent: state.words.skip }),
        el("div", { className: "stamp yes", textContent: state.words.take }),
        state.used.has(shot.href)
          ? el("span", {
              className: "used",
              textContent: "Already a reference",
            })
          : null,
        el("div", { className: "picture" }, [
          el("img", {
            alt: shot.title,
            draggable: false,
            src: sized(shot.image, "1600x1200"),
          }),
        ]),
        el("div", { className: "bottom" }, [
          el("div", { className: "title" }, [
            el("b", { textContent: shot.title || "Untitled shot" }),
            el("span", { textContent: ` · ${shot.source} · ` }),
            el("a", {
              href: shot.href,
              rel: "noreferrer",
              target: "_blank",
              textContent: state.words.link,
            }),
          ]),
          el("input", {
            className: "note",
            placeholder: "What is worth learning from it (optional)",
            value: state.taken.get(shot.href) ?? "",
          }),
          el("div", { className: "actions" }, [
            decisionButton(shot, "skip", "no", state.words.skip, "←"),
            decisionButton(shot, "later", "", "Later", "↓"),
            decisionButton(shot, "take", "yes", state.words.take, "→"),
          ]),
        ]),
      ]);
      main.replaceChildren(node);
      drag(node);
      // The next shot loaded while this one is looked at.
      const [, next] = deck();
      if (next) {
        new Image().src = sized(next.image, "1600x1200");
      }
    }

    function inView(shot) {
      if (state.view === "taken") {
        return state.taken.has(shot.href);
      }
      if (state.view === "skipped") {
        return state.skipped.has(shot.href);
      }
      if (state.view === "used") {
        return state.used.has(shot.href);
      }
      return true;
    }

    function renderGrid() {
      const main = $("main");
      main.className = "grid";
      main.replaceChildren(
        ...state.shots.filter(inView).map((shot) => {
          let mark = "";
          if (state.taken.has(shot.href)) {
            mark = " taken";
          } else if (state.skipped.has(shot.href)) {
            mark = " skipped";
          }
          return el(
            "article",
            {
              className: `shot${mark}`,
              // Opened from the grid, a shot is decided again in the deck.
              onclick: () => {
                state.revisit = shot.href;
                state.view = "deck";
                render();
              },
            },
            [
              el("img", {
                alt: shot.title,
                loading: "lazy",
                src: sized(shot.image, "800x600"),
              }),
              el("p", {}, [
                shot.title || "Untitled shot",
                el("span", { textContent: ` · ${shot.source}` }),
              ]),
            ]
          );
        })
      );
    }

    /** A sideways swipe decides; one up or down is left to scroll. */
    function drag(node) {
      let start = null;
      let swiping = false;
      const stamps = [
        node.querySelector(".stamp.no"),
        node.querySelector(".stamp.yes"),
      ];
      const reset = () => {
        start = null;
        swiping = false;
        node.classList.remove("dragging");
        node.style.transform = "";
        for (const s of stamps) {
          s.style.opacity = "0";
        }
      };
      node.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button, input, a") || e.button > 0) {
          return;
        }
        start = { x: e.clientX, y: e.clientY };
      });
      node.addEventListener("pointermove", (e) => {
        if (start === null) {
          return;
        }
        const dx = e.clientX - start.x;
        const dy = e.clientY - start.y;
        if (!swiping) {
          if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) {
            start = null;
            return;
          }
          if (Math.abs(dx) < 10) {
            return;
          }
          swiping = true;
          node.classList.add("dragging");
          node.setPointerCapture(e.pointerId);
        }
        node.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
        stamps[0].style.opacity = String(Math.min(1, Math.max(0, -dx / 100)));
        stamps[1].style.opacity = String(Math.min(1, Math.max(0, dx / 100)));
      });
      node.addEventListener("pointerup", (e) => {
        if (start === null || !swiping) {
          start = null;
          return;
        }
        const dx = e.clientX - start.x;
        if (Math.abs(dx) > Math.min(140, node.offsetWidth * 0.28)) {
          start = null;
          swiping = false;
          node.classList.remove("dragging");
          decide(dx > 0 ? "take" : "skip");
          return;
        }
        reset();
      });
      node.addEventListener("pointercancel", reset);
    }

    document.addEventListener("keydown", (e) => {
      const typing = e.target.matches?.("input, textarea");
      const side = {
        ArrowDown: "later",
        ArrowLeft: "skip",
        ArrowRight: "take",
      }[e.key];
      if (typing) {
        if (e.key === "Escape") {
          e.target.blur();
        }
        // While a note is typed, Ctrl or ⌘ with an arrow decides with it.
        if ((e.ctrlKey || e.metaKey) && side) {
          e.preventDefault();
          decide(side);
        }
        return;
      }
      if (state.view !== "deck") {
        return;
      }
      if (side) {
        e.preventDefault();
        decide(side);
      } else if (e.key === "z") {
        back();
      } else if (e.key === "n") {
        e.preventDefault();
        document.querySelector(".note")?.focus();
      }
    });
    $("back").addEventListener("click", back);
    load();
    </script>
  </body>
</html>
