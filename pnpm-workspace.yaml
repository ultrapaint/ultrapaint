packages:
  - apps/*
  - packages/*

catalog:
  '@effect/platform-node': 4.0.0
  # Not a dependency of any package: @effect/platform-node's own, held to the same release by the
  # override below.
  '@effect/platform-node-shared': 4.0.0
  '@effect/vitest': 4.0.0
  effect: 4.0.0

overrides:
  '@effect/platform-node-shared': 'catalog:'
  effect: 'catalog:'

allowBuilds:
  # The desktop app's Electron fetches its binary when it is installed (ADR 0031).
  electron: true
  esbuild: true

# The desktop app bundles the agents' ACP adapters (ADR 0031) but not the agents themselves: the
# native Claude Code and Codex binaries are the user's own, or downloaded when asked for.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
  - '@openai/codex-*'

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.14'
  - '@biomejs/cli-darwin-arm64@2.5.14'
  - '@biomejs/cli-darwin-x64@2.5.14'
  - '@biomejs/cli-linux-arm64-musl@2.5.14'
  - '@biomejs/cli-linux-arm64@2.5.14'
  - '@biomejs/cli-linux-x64-musl@2.5.14'
  - '@biomejs/cli-linux-x64@2.5.14'
  - '@biomejs/cli-win32-arm64@2.5.14'
  - '@biomejs/cli-win32-x64@2.5.14'
  - '@effect/platform-node-shared@4.0.0'
  - '@effect/platform-node@4.0.0'
  - '@effect/vitest@4.0.0'
  - 'effect@4.0.0'
  - '@agentclientprotocol/sdk@1.6.0'
