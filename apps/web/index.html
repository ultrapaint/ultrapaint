<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Ultrapaint</title>
  <!-- The theme before the editor's code arrives: the saved preference, else the system's. -->
    <script>
      (() => {
        const saved = localStorage.getItem("ultrapaint:theme");
        const dark =
          saved === "dark" ||
          (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <style>
      body { margin: 0; background: oklch(0.945 0.004 80); }
      .dark body { background: oklch(0.165 0.004 70); }
      .splash-label { color: oklch(0.53 0.01 65); }
      .dark .splash-label { color: oklch(0.67 0.008 75); }
    </style>
  </head>
  <body>
    <!--
      The splash before the editor's code has arrived, drawn without it; React then draws the same
      (`components/splash.tsx`) until the editor is ready, in its place.
    -->
    <div id="root">
      <div
        style="position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; font-family: 'Onest Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
      >
        <svg aria-label="Ultrapaint" role="img" viewBox="0 0 24 24" width="40" height="40">
          <rect fill="oklch(0.56 0.2 263)" height="24" rx="6.5" width="24" />
          <path d="M7.5 7v4.75a4.5 4.5 0 0 0 9 0V5.5" fill="none" stroke="oklch(0.99 0 0)" stroke-linecap="round" stroke-width="2.6" />
        </svg>
        <span
          class="splash-label"
          style="font-size: 14px; line-height: 20px"
          >Opening</span
        >
      </div>
    </div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
