<!doctype html>
<!--
  The window's page when no project is open: the app's first start, or a project that could not
  start. It asks for a folder, or another project of the list, through the same Platform bridge
  the editor's switcher uses.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
      http-equiv="Content-Security-Policy"
    >
    <title>Ultrapaint</title>
    <style>
    :root {
      font-family: system-ui, sans-serif;
      color-scheme: dark;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      color: #e8e8ea;
      background: #1a1a1d;
    }
    main {
      max-width: 28rem;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
    }
    p {
      margin: 0 0 1.5rem;
      line-height: 1.5;
      color: #a1a1aa;
    }
    .problem {
      padding: 0.75rem 1rem;
      color: #fca5a5;
      white-space: pre-wrap;
      background: #2a1d1f;
      border-radius: 0.5rem;
    }
    button {
      padding: 0.5rem 1rem;
      font: inherit;
      color: white;
      cursor: pointer;
      background: #4f8cff;
      border: 0;
      border-radius: 0.375rem;
    }
    ul {
      padding: 0;
      margin: 0 0 1.5rem;
      list-style: none;
    }
    li button {
      width: 100%;
      padding: 0.375rem 0;
      color: inherit;
      text-align: left;
      background: transparent;
    }
    li button small {
      display: block;
      color: #71717a;
    }
    </style>
  </head>
  <body>
    <main>
      <h1>Ultrapaint</h1>
      <p id="intro">
        Open a folder to design in: a repository with your components, or an
        empty folder. The project list keeps it for next time.
      </p>
      <p class="problem" hidden id="problem"></p>
      <ul id="projects"></ul>
      <button id="add" type="button">Add a project folder…</button>
    </main>
    <script defer src="welcome.js"></script>
  </body>
</html>
